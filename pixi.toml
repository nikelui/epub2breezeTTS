[workspace]
authors = ["nikelui <nikelui@hotmail.it>"]
channels = ["conda-forge"]
name = "breeze_python"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build-breeze = "python -m pip install --no-build-isolation -e ./breeze_python"
test-breeze = "python -c \"from breeze import BreezeWrapper; print('Breeze OK')\""
ebook-process = { cmd = "python -m epub_audiobook.cli", env = {PYTHONPATH = "src"}}

[dependencies]
python = ">=3.15.0,<3.16"
cython = ">=3.3.0,<4"
setuptools = ">=84.0.0,<85"
wheel = ">=0.48.0,<0.49"
pip = ">=26.2.1,<27"
ebooklib = ">=0.17,<0.18"
beautifulsoup4 = ">=4.15.0,<5"
lxml = ">=6.1.3,<7"
pysbd = ">=0.3.4,<0.4"
pytest = ">=9.1.1,<10"

