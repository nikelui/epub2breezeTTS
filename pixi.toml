[workspace]
authors = ["nikelui <nikelui@hotmail.it>"]
channels = ["conda-forge"]
name = "breeze_python"
description = "Convert EPUBs to audiobooks using Breeze TTS"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
build-breeze = "python -m pip install --no-build-isolation -e ./breeze_python"
test-breeze = "python -c \"from breeze import BreezeWrapper; print('Breeze OK')\""
epub2breeze = {cmd = "python -m epub_audiobook.cli.main", env = {PYTHONPATH = "src"}}

[dependencies]
python = ">=3.15.0,<3.16"
cython = ">=3.3.0,<4"
setuptools = ">=84.0.0,<85"
wheel = ">=0.48.0,<0.49"
pip = ">=26.2.1,<27"
beautifulsoup4 = ">=4.15.0,<5"
lxml = ">=6.1.3,<7"
pysbd = ">=0.3.4,<0.4"
pytest = ">=9.1.1,<10"
requests = ">=2.34.2,<3"
debugpy = ">=1.8.22,<2"
ffmpeg = ">=9.0.2,<10"

[pypi-dependencies]
ebooklib = "==0.20"
